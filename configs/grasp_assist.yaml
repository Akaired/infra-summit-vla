enabled: true
log_events: true

drawer:
  equality_name: right_grasp_connect
  gripper_body: right_moving_jaw_so101_v1
  object_body: drawer
  handle_geom: drawer_handle
  joint_name: drawer_slide

  contact_bodies:
    - right_gripper
    - right_moving_jaw_so101_v1

  gripper_action_index: 11
  require_closed_for_activation: true
  close_threshold: -0.05
  open_threshold: 0.05

  opened_travel_fraction: 0.60
  release_max_travel_fraction: 0.15
  release_closed_hold_policy_steps: 10
  release_timeout_policy_steps: 80
  prevent_reactivation_after_completed_cycle: true

plate:
  equality_name: left_grasp_weld
  gripper_body: left_gripper
  object_body: plate

  contact_bodies:
    - left_gripper
    - left_moving_jaw_so101_v1

  gripper_site: left_gripperframe
  gripper_action_index: 5

  # Weld fires only on contact AND a commanded close. With `false` it fired
  # on any contact at any gripper position, so a bump-and-raise counted as a
  # pick-up -- the chunk probe shows the policy holds 49-50/50 CLOSED through
  # the whole carry, so the model does not need the concession.
  require_closed_for_activation: true

  # The action channel is trimodal: -0.16 (closed) / 0.0 (idle, 35% of
  # training frames) / 1.2 (open). Thresholds sit at the midpoints, not next
  # to a mode: at open_threshold 0.05 a single noisy sample at +0.06 -- or a
  # measured intermediate prediction like +0.51 -- read as "open" and
  # released the plate mid-carry.
  close_threshold: -0.08
  open_threshold: 0.6

  # Activation. In demo collection the weld was driven by the script, so
  # these keys exist only for rollout, where the grasp has to be inferred.
  activation_mode: contact
  activation_site: left_gripperframe
  activation_distance_m: 0.03

  minimum_lift_before_release_m: 0.05
  release_site_z_m: 0.85
  release_open_hold_policy_steps: 2
  release_timeout_policy_steps: 40
  prevent_reactivation_after_release: true
