# ДИАГНОСТИЧЕСКИЙ конфиг, Шаг 2: проверка гипотезы об open-loop horizon.
#
# Отличается от configs/smolvla_rollout.yaml РОВНО ДВУМЯ полями:
#   model.n_action_steps : 50 -> 10
#   output.directory     : отдельный каталог, чтобы не смешивать с baseline
#
# Больше не меняется НИЧЕГО: веса, датасет, grasp assist, геометрия сцены,
# разрешения камер, критерии успеха -- всё то же, что в baseline.
#
# Арифметика окна: один policy step = action_repeat(2) * control_decimation(10)
# * timestep(0.002) = 0.04 с. При n_action_steps=50 модель не видит новых
# наблюдений 2.0 с; при 10 -- 0.4 с, горизонт короче в 5 раз.
#
# Почему 10, а не 1: pred[0] в чанке фактически копирует текущее состояние
# (измерено chunk-пробой), поэтому при n_action_steps=1 каждая команда
# превращается в "стой где стоишь" и рука замирает. При 10 на копию состояния
# уходит 10% команд против 2% при 50 -- приемлемая цена. 10 делит 50 без
# остатка, границы чанков остаются выровненными.

configs:
  sim: configs/sim.yaml
  randomization: configs/randomization.yaml
  grasp_assist: configs/grasp_assist.yaml

model:
  checkpoint: checkpoints/048000-native-geometry
  device: cuda
  torch_seed_offset: 0
  n_action_steps: 10
task:
  instruction: >-
    Open the drawer, close the drawer, pick up the plate, and place the
    plate in the center of the table.
  task_feature_key: task

observation:
  # EpisodeScene возвращает:
  # robot_state = 12 qpos + 12 qvel.
  # SmolVLA должна получить только первые 12 qpos.
  state:
    source_key: robot_state
    feature_key: observation.state
    start: 0
    size: 12

  images_source_key: images
  pixel_divisor: 255.0
  resize:
    mode: bilinear
    align_corners: false
    antialias: true

  cameras:
    - source_name: overhead
      feature_key: observation.images.overhead

    - source_name: wrist_left
      feature_key: observation.images.wrist_left

    - source_name: wrist_right
      feature_key: observation.images.wrist_right

action:
  feature_key: action
  size: 12
  clip_to_actuator_range: true

  # Порядок обязан совпадать с dataset, checkpoint и MJCF.
  actuator_names:
    - left_shoulder_pan
    - left_shoulder_lift
    - left_elbow_flex
    - left_wrist_flex
    - left_wrist_roll
    - left_gripper
    - right_shoulder_pan
    - right_shoulder_lift
    - right_elbow_flex
    - right_wrist_flex
    - right_wrist_roll
    - right_gripper

rollout:
  # В демонстрациях кадр записывался раз в два control-такта.
  # Один прогноз модели поэтому удерживается два вызова scene.step().
  action_repeat: 2
  max_policy_steps: 600
  stop_on_success: true
  success_hold_policy_steps: 10
  progress_every_policy_steps: 25

  # Детерминизм прогона. Замерено eval/check_determinism.py:
  # доминирующий источник расхождения -- офскрин-рендер MuJoCo
  # (два подряд render() одной сцены дают ±1 младший бит на всех
  # трёх камерах, что за 600 шагов замкнутого контура меняет исход
  # эпизода), а не CUDA-ядра (~1e-7).
  #
  # deterministic_render гасит сглаживание и тени и пересоздаёт
  # рендереры. deterministic_kernels дополнительно включает
  # cudnn.deterministic, отключает TF32 и
  # torch.use_deterministic_algorithms.
  #
  # ОБА включены по замеру 2026-09-15 (пять прогонов по 10 сидов):
  #   render=True, kernels=False -> прогоны 2 и 3 побитово равны, но
  #     ПЕРВЫЙ отличается: автотюн cuDNN выбирает алгоритм по
  #     таймингам, а на холодном GPU выбор другой.
  #   render=True, kernels=True  -> два прогона побитово равны,
  #     ВКЛЮЧАЯ первый. Цена +5.0% времени (134.8 -> 141.5 с на
  #     десять эпизодов).
  #
  # ВАЖНО: 8/10 от 2026-09-15 измерено при deterministic_render=false
  # и было удачным розыгрышем. Воспроизводимый baseline -- 7/10.
  deterministic_render: true
  deterministic_kernels: true

evaluation:
  seeds:
    source_config: configs/randomization.yaml
    source_key: seeds

  events:
    drawer_opened: drawer_opened
    drawer_closed: drawer_closed
    plate_lifted: plate_lifted
    plate_placed: plate_placed

  sequence:
    - drawer_opened
    - drawer_closed
    - plate_lifted
    - plate_placed

  drawer:
    joint_name: drawer_slide
    opened_travel_fraction: 0.60
    closed_travel_fraction: 0.15

  plate:
    body_name: plate
    lifted_delta_z_m: 0.05

    # plate_placed = тарелку РЕАЛЬНО переместили, вернули на поверхность,
    # она стоит, и weld отпущен. Тот же критерий, что объявлен в
    # configs/eval.yaml:88-89 для второго харнесса.
    #
    # Абсолютная целевая точка здесь не задаётся обоснованно: демо наводят
    # ГРИППЕР в точку из scripted_episode_ik.PLACE_ZONE (центр -0.05,-0.06,
    # а не центр стола), сэмплер в заметной доле эпизодов уходит в
    # fallback с радиальным сдвигом за пределы своей же зоны, а тарелка
    # приварена за ОБОД -- её центр оказывается в ~0.9*0.089 = 0.08 м от
    # того, куда наводили. Радиус, принимающий всё это, принимает
    # пол-стола.
    placed_min_xy_displacement_m: 0.05
    surface_z_tolerance_m: 0.035
    resting_linear_speed_mps: 0.08

    # ТОЛЬКО для диагностики: eval/diagnose_plate.py считает по ним
    # legacy-критерий рядом с рабочим, чтобы расхождение было видно.
    # Харнесс их не использует.
    target_xy_m: [0.0, 0.0]
    target_radius_m: 0.12

    # TaskTracker confirms plate_lifted only when the COMMANDED gripper was
    # closed and something actually holds the plate (assisted weld, or these
    # jaw bodies in real contact with it). Without that the harness counted a
    # lift that existed only because GraspAssist glued the plate on.
    gripper_action_index: 5
    gripper_close_threshold: -0.08
    gripper_contact_bodies:
      - left_gripper
      - left_moving_jaw_so101_v1

# Физика захвата (контакты, пороги, релиз) живёт в
# configs/grasp_assist.yaml -- он общий с записью демонстраций.
# Здесь только rollout-специфичные переопределения; пустой блок
# означает "берём внешний конфиг как есть".
grasp_assist: {}

output:
  directory: outputs/eval/ckpt-048000-native-nas10
  overwrite: true
  episodes_filename: episodes.jsonl
  summary_filename: summary.json

  video:
    enabled: true
    camera: overhead
    fps: 25
    every_n_policy_steps: 1
    filename_pattern: seed_{seed}.mp4
