<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Vino &amp; Dine — Live Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #181c25;
    --border: #262b36;
    --text: #e7e9ee;
    --muted: #8b93a3;
    --accent: #7dd3a8;
    --accent-2: #e0b04a;
    --danger: #e06a6a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
  }
  #app {
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 56px 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / 3;
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  #status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 6px var(--danger);
  }
  #status-dot.connected { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  #viewport { position: relative; background: #05070a; }
  #viewport canvas { display: block; }
  #viewport-overlay {
    position: absolute; top: 12px; left: 12px;
    font-size: 11px; color: var(--muted);
    background: rgba(10,12,16,0.6); padding: 6px 10px; border-radius: 6px;
    pointer-events: none;
  }
  #sidebar {
    display: flex; flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    overflow: hidden;
  }
  #seed-row {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  #seed-row label { font-size: 12px; color: var(--muted); }
  select, button, input[type=text] {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 13px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #06110b; border-color: var(--accent); font-weight: 600; }
  button.stop { border-color: var(--danger); color: var(--danger); background: transparent; }
  #subtasks { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  #subtasks h2, #log h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .subtask-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 3px 0; }
  .badge { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .badge.completed { background: var(--accent); }
  .badge.incomplete { background: #3a4050; }
  .badge.not_implemented { background: #4a4030; }
  .subtask-name { flex: 1; }
  .subtask-status { color: var(--muted); font-size: 10.5px; text-transform: uppercase; }
  #log {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    padding: 12px 14px;
  }
  #log-lines {
    flex: 1; overflow-y: auto; font-size: 12px; color: var(--muted);
    display: flex; flex-direction: column-reverse; gap: 4px;
  }
  #log-lines .line { color: var(--text); }
  #log-lines .line.you { color: var(--accent-2); }
  #log-lines .line.err { color: var(--danger); }
  #chat-row {
    display: flex; gap: 6px; padding: 12px 14px; border-top: 1px solid var(--border);
  }
  #chat-input { flex: 1; }
  #meta { padding: 10px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="status-dot"></div>
    <h1>Vino &amp; Dine — Bimanual VLA</h1>
    <span class="sub">local viewer · not graded · real policy behind it</span>
  </header>

  <div id="viewport">
    <div id="viewport-overlay">seed: <span id="ov-seed">–</span> · step: <span id="ov-step">0</span></div>
  </div>

  <div id="sidebar">
    <div id="seed-row">
      <label for="seed-select">Seed</label>
      <select id="seed-select"></select>
      <button id="reset-btn">Reset</button>
    </div>

    <div id="subtasks">
      <h2>Subtasks</h2>
      <div id="subtask-list"><span class="sub" style="color:var(--muted)">waiting for scene…</span></div>
    </div>

    <div id="log">
      <h2>Command log</h2>
      <div id="log-lines"></div>
    </div>

    <div id="chat-row">
      <input id="chat-input" type="text" placeholder="e.g. open the top drawer" />
      <button id="send-btn" class="primary">Send</button>
      <button id="stop-btn" class="stop">Stop</button>
    </div>

    <div id="meta">
      policy: <span id="meta-policy">–</span> · camera: <span id="meta-camera">–</span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- urdf-loader's UMD build wants THREE.STLLoader / THREE.ColladaLoader as
     properties on the THREE global (see apps/web/README.md) -- these two
     must load, in this order, before URDFLoader.js below. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/ColladaLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/urdf-loader@0.12.1/umd/URDFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------------------------------------------------------------------------
// Real SO-101 rig: the actual TheRobotStudio/SO-ARM100 URDF + STL meshes
// (apps/web/static/so101/, Apache-2.0), loaded via urdf-loader. Two
// instances are built -- one per arm -- and positioned at the compiled
// MJCF's left_arm_base / right_arm_base offsets (from GET /api/info's
// arm_rig.bases), so they sit where the sim's placeholder arms sit.
//
// The URDF's own joint names/proportions do NOT match the sim's placeholder
// rig (sim/assets/dinner_table_dual_so101.xml is explicitly a stand-in, see
// its header comment) -- there is no mesh-accurate rig anywhere in this repo
// to match exactly. Each arm's 6 qpos values (5 arm joints + gripper, in
// actuator order) are mapped by INDEX onto the URDF's 6 joints in its own
// natural chain order (shoulder_pan, shoulder_lift, elbow_flex, wrist_flex,
// wrist_roll, gripper) -- see ARM_JOINT_ORDER below. Motion is faithful to
// the real policy's action sequence and timing; absolute pose will not
// match the sim's simplified capsule geometry pixel-for-pixel.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// MuJoCo (z-up, right-handed: x,y,z) -> three.js (y-up, right-handed) frame
// conversion, used everywhere a position/quaternion crosses from the sim to
// the viewer. This MUST be a real rotation (determinant +1), not a bare
// axis swap: three=(x, z, y) swaps two axes, which has determinant -1 --
// that's a mirror reflection, not a rotation. A mirror is harmless for
// pure positions (translation doesn't care about handedness) but WRONG for
// every rotated thing in this scene (mesh faces, joint orientations, box
// rotations) -- it silently flips winding/orientation, which is exactly
// the kind of "everything is subtly misplaced/backwards" bug a screenshot
// review catches but the position numbers alone don't. The correct
// conversion is a genuine -90 degree rotation about X: three=(x, z, -y).
// ---------------------------------------------------------------------------
function mjPosToThree(p) {
  return new THREE.Vector3(p[0], p[2], -p[1]);
}
function mjQuatToThree(q) {
  // q is MuJoCo wxyz. Conjugating by the same -90-about-X change of basis:
  // (w, x, y, z) -> (w, x, z, -y) in three's (x,y,z,w) constructor order.
  return new THREE.Quaternion(q[1], q[3], -q[2], q[0]);
}

const viewport = document.getElementById('viewport');
const scene3d = new THREE.Scene();
scene3d.background = new THREE.Color(0x05070a);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 50);
// Sim frame is z-up (table top at z=0.75); viewer is y-up (mujocoToThree
// remaps z,y -> y,z everywhere below), so this is that same point remapped:
// looking at the table surface from an angled, slightly-above vantage.
camera.position.set(1.1, 1.1, 0.9);
camera.lookAt(0, 0.75, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
viewport.appendChild(renderer.domElement);

// Drag to orbit, scroll to zoom, right-drag/two-finger to pan -- without
// this the camera was completely fixed, which made it impossible to look
// around the scene at all.
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

function resizeRenderer() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);

scene3d.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 2, 1);
scene3d.add(dirLight);

const grid = new THREE.GridHelper(2, 20, 0x2a2f3a, 0x1a1e26);
grid.position.y = -0.001;
scene3d.add(grid);

// ---------------------------------------------------------------------------
// Static scene (table, drawer shell, room) -- built from GET /api/info's
// static_scene, which reads the actual compiled MJCF geoms
// (sim/assets/dinner_table_dual_so101.xml) rather than guessing a slab.
// Every body in static_scene becomes one THREE.Group holding one mesh per
// MuJoCo geom, positioned/rotated exactly as MuJoCo compiled them. A body
// with a slide/hinge joint (currently just "drawer") is kept in
// jointedBodies so live WS "objects" position updates can move the whole
// group, not just redraw a single primitive.
// ---------------------------------------------------------------------------

const MJ_TYPE_TO_THREE = { box: 'box', sphere: 'sphere', cylinder: 'cylinder', capsule: 'capsule', plane: 'plane' };
const jointedBodies = {}; // body name -> THREE.Group, for bodies with a joint (e.g. drawer)

// MuJoCo's own cylinder/capsule primitives have their long axis along local
// Z; three's CylinderGeometry/CapsuleGeometry have theirs along local Y. A
// mesh built in three's local frame needs a fixed -90-about-X correction
// for that axis difference alone (independent of, and applied BEFORE, the
// geom's own mjQuatToThree orientation above it).
const CYLINDER_AXIS_FIX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2);

function meshFromStaticGeom(g) {
  const kind = MJ_TYPE_TO_THREE[g.type];
  let geom;
  const [sx, sy, sz] = g.size;
  if (kind === 'box') geom = new THREE.BoxGeometry(sx * 2, sz * 2, sy * 2); // mj half-extents, z/y swapped for y-up
  else if (kind === 'sphere') geom = new THREE.SphereGeometry(sx, 16, 16);
  else if (kind === 'cylinder') geom = new THREE.CylinderGeometry(sx, sx, sy * 2, 20);
  else if (kind === 'capsule' && THREE.CapsuleGeometry) geom = new THREE.CapsuleGeometry(sx, sy * 2, 4, 12);
  else if (kind === 'capsule') geom = new THREE.CylinderGeometry(sx, sx, sy * 2, 12); // r128 has no CapsuleGeometry
  else if (kind === 'plane') geom = new THREE.PlaneGeometry((sx || 4) * 2, (sy || 4) * 2);
  else return null;

  const [r, gc, b, a] = g.rgba && g.rgba.length === 4 ? g.rgba : [0.6, 0.6, 0.6, 1];
  const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
    color: new THREE.Color(r, gc, b), transparent: a < 1, opacity: a, roughness: 0.8,
  }));
  mesh.position.copy(mjPosToThree(g.pos));
  mesh.quaternion.copy(mjQuatToThree(g.quat));
  if (kind === 'plane') mesh.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -Math.PI / 2));
  if (kind === 'cylinder' || kind === 'capsule') mesh.quaternion.multiply(CYLINDER_AXIS_FIX);
  return mesh;
}

function buildStaticScene(staticScene) {
  const bodies = staticScene?.bodies || {};
  for (const [bodyName, body] of Object.entries(bodies)) {
    const group = new THREE.Group();
    group.position.copy(mjPosToThree(body.body_pos));
    for (const g of body.geoms) {
      const mesh = meshFromStaticGeom(g);
      if (mesh) group.add(mesh);
    }
    scene3d.add(group);
    if (body.joint) {
      // Store the body's own base offset once; live position updates below
      // (from WS "objects", which already includes "drawer") replace this
      // group's position outright each tick with the current sim-frame
      // world position, so no separate joint-value math is needed here.
      jointedBodies[bodyName] = group;
      if (bodyName === 'drawer') buildDrawerCabinetShell(body.body_pos);
    }
  }
}

// ---------------------------------------------------------------------------
// Purely cosmetic cabinet shell around the drawer -- NOT part of the MJCF,
// NOT physics, NOT collidable, never moves. The sim's own drawer body (see
// sim/assets/dinner_table_dual_so101.xml) is only the sliding compartment
// itself (floor + 4 walls + handle) -- the source model has no outer
// cabinet/frame around it at all, which is a real gap in that asset (kept
// that way there, since it doesn't affect the physics/task), not something
// this viewer got wrong. Confirmed by reading the MJCF directly: the
// <body name="drawer"> block has no sibling frame body anywhere in the file.
// Rendered here as a fixed static shell sized to just contain the drawer's
// own closed-position footprint, so it doesn't render as floating/detached
// under the table. Positioned once from static_scene's own body_pos (never
// hardcoded), sized from the drawer geoms' own known half-extents (also
// read from the compiled model via describe_static_scene, not guessed).
function buildDrawerCabinetShell(drawerBodyPosMj) {
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 0.85 });
  const shell = new THREE.Group();
  // Drawer's own geoms (from the MJCF, read via /api/info) span roughly
  // x:[-0.12,0.12] y:[-0.08,0.085] z:[-0.037,0.04] in its local frame -- the
  // cabinet just needs to be a hair bigger on every side except the front
  // (+Y, where it opens) to read as "the drawer slides out of this".
  const halfX = 0.125, halfZlocal = 0.045, frontY = 0.09, backY = -0.085;
  const thickness = 0.008;
  // MJCF local (x, y, z) -> three local (x, z, -y), matching mjPosToThree.
  const toThreeLocal = (x, y, z) => new THREE.Vector3(x, z, -y);

  function panel(sizeX, sizeY, sizeZ, mjX, mjY, mjZ) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(sizeX, sizeZ, sizeY), wallMat);
    mesh.position.copy(toThreeLocal(mjX, mjY, mjZ));
    shell.add(mesh);
  }
  // Left/right side panels (run front-to-back, at +-halfX)
  panel(thickness, frontY - backY, halfZlocal * 2, -halfX, (frontY + backY) / 2, 0);
  panel(thickness, frontY - backY, halfZlocal * 2, halfX, (frontY + backY) / 2, 0);
  // Back panel (closed end, -Y)
  panel(halfX * 2, thickness, halfZlocal * 2, 0, backY, 0);
  // Bottom panel (slightly below the drawer's own floor so it doesn't z-fight)
  panel(halfX * 2, frontY - backY, thickness, 0, (frontY + backY) / 2, -halfZlocal - 0.002);
  // Top panel (so it reads as a closed cabinet from above/the side, not an
  // open-topped tray)
  panel(halfX * 2, frontY - backY, thickness, 0, (frontY + backY) / 2, halfZlocal + 0.002);

  shell.position.copy(mjPosToThree(drawerBodyPosMj));
  scene3d.add(shell);
}

// ---------------------------------------------------------------------------
// Table objects. Anything with a real visual mesh (GET /api/info's
// object_meshes -- plate/cup/spoon/fork, read straight from the compiled
// MJCF's own mesh_vert/mesh_face/mesh_texcoord arrays, see server.py's
// describe_object_meshes()) is drawn as that actual mesh, textured from its
// real texture_map.png when one is mapped. Anything without one (currently
// just "bottle", a primitive MJCF cylinder with no mesh asset) falls back
// to a simple primitive -- not a guess at what the object looks like, just
// the true shape the sim itself uses for it.
// ---------------------------------------------------------------------------

const objectMeshes = {}; // body name -> THREE.Object3D (mesh or primitive fallback)
const FALLBACK_COLORS = { bottle: 0x4a90d9, drawer: 0x8b6a3a, mug: 0x7dd3a8 };
const textureLoader = new THREE.TextureLoader();

function buildObjectMesh(name, meshData) {
  // MuJoCo's own compiled-mesh frame chain (server.py's describe_object_meshes
  // docstring): world = body_xform * geom_xform * mesh_xform * mesh_vert.
  // body_xform is applied at runtime (position/quaternion on the returned
  // Object3D, updated every WS tick from live "objects" pos+quat); geom_xform
  // and mesh_xform are both fixed for the object's lifetime, so they're baked
  // once into the BufferGeometry here rather than kept as extra live nodes.
  const geometry = new THREE.BufferGeometry();
  const verts = new Float32Array(meshData.vertices.flat());
  geometry.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geometry.setIndex(meshData.faces.flat());
  if (meshData.texcoords && meshData.face_texcoords) {
    // mesh_face and mesh_facetexcoord can index vertices/uvs independently;
    // rebuild a per-vertex UV array aligned to the position buffer by
    // scattering each face's texcoord triplet onto that face's vertex
    // indices (a vertex shared by faces with consistent UVs is written
    // redundantly but consistently -- fine for a static prop mesh).
    const uv = new Float32Array((verts.length / 3) * 2);
    const faces = meshData.faces;
    const faceUvs = meshData.face_texcoords;
    const src = meshData.texcoords;
    for (let f = 0; f < faces.length; f++) {
      for (let k = 0; k < 3; k++) {
        const vi = faces[f][k];
        const ti = faceUvs[f][k];
        uv[vi * 2] = src[ti][0];
        uv[vi * 2 + 1] = 1 - src[ti][1]; // MuJoCo/OBJ v is bottom-up; three's is top-down
      }
    }
    geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  } else if (meshData.texcoords) {
    // No independent face-texcoord indexing available (older MuJoCo): the
    // mesh_face indices double as texcoord indices directly.
    const uv = new Float32Array((verts.length / 3) * 2);
    for (let i = 0; i < meshData.texcoords.length; i++) {
      uv[i * 2] = meshData.texcoords[i][0];
      uv[i * 2 + 1] = 1 - meshData.texcoords[i][1];
    }
    geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  }
  geometry.computeVertexNormals();

  // Bake geom_xform (geom-local -> body frame) into the geometry, entirely
  // in MuJoCo's own coordinate frame first (raw wxyz quaternion rotation
  // applied by hand below, NOT through THREE.Quaternion, which assumes its
  // own y-up axis convention and would rotate around the wrong axes for a
  // raw mj-frame quaternion). Only the FINAL result gets converted to
  // three's frame via mjPosToThree.
  //
  // Deliberately does NOT also apply a separate "mesh_pos/mesh_quat" step:
  // model.mesh_vert (what server.py sends as "vertices") is already
  // MuJoCo's COMPILED mesh, re-centered/re-aligned into its own inertial
  // frame at compile time -- that exact offset is already baked into this
  // geom's own geom_pos/geom_quat by the compiler (confirmed: this repo's
  // mesh geoms have no explicit pos/quat of their own, so the compiler set
  // geom_pos/geom_quat equal to the mesh asset's centering offset exactly).
  // Applying a second mesh-level offset on top double-rotated every object
  // -- that was the actual cause of "plate rendered on its side" here, not
  // a coordinate-frame bug. mesh_pos/mesh_quat only matter when loading raw
  // vertices from the *original* OBJ/STL file, which this never does.
  function rotateVecByMjQuat(v, q) {
    // Standard quaternion-rotate-vector (Rodrigues), q as [w,x,y,z]:
    // v' = v + 2*w*(qv x v) + 2*(qv x (qv x v)), qv = (x,y,z)
    const [w, x, y, z] = q;
    const qv = [x, y, z];
    const cross1 = [
      qv[1] * v[2] - qv[2] * v[1],
      qv[2] * v[0] - qv[0] * v[2],
      qv[0] * v[1] - qv[1] * v[0],
    ];
    const t = [cross1[0] * 2 * w, cross1[1] * 2 * w, cross1[2] * 2 * w];
    const cross2 = [
      qv[1] * cross1[2] - qv[2] * cross1[1],
      qv[2] * cross1[0] - qv[0] * cross1[2],
      qv[0] * cross1[1] - qv[1] * cross1[0],
    ];
    return [
      v[0] + t[0] + 2 * cross2[0],
      v[1] + t[1] + 2 * cross2[1],
      v[2] + t[2] + 2 * cross2[2],
    ];
  }

  const posAttr = geometry.getAttribute('position');
  for (let i = 0; i < posAttr.count; i++) {
    let v = [posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i)];
    // geom-local (== already-compiled mesh frame) -> body frame, ONCE.
    v = rotateVecByMjQuat(v, meshData.geom_quat);
    v = [v[0] + meshData.geom_pos[0], v[1] + meshData.geom_pos[1], v[2] + meshData.geom_pos[2]];
    // body (mj) frame -> three's frame, exactly once, last.
    const p = mjPosToThree(v);
    posAttr.setXYZ(i, p.x, p.y, p.z);
  }
  posAttr.needsUpdate = true;
  geometry.computeVertexNormals();

  const materialOpts = { color: 0xffffff, roughness: 0.75 };
  if (meshData.texture) materialOpts.map = textureLoader.load(meshData.texture);
  if (!meshData.texture && meshData.rgba) {
    const [r, g, b] = meshData.rgba;
    materialOpts.color = new THREE.Color(r, g, b);
  }
  const mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial(materialOpts));
  scene3d.add(mesh);
  return mesh;
}

function buildFallbackObjectMesh(name) {
  const isCutlery = /^(spoon|fork)/.test(name);
  const geom = isCutlery
    ? new THREE.BoxGeometry(0.02, 0.01, 0.12)
    : new THREE.CylinderGeometry(0.025, 0.025, 0.18, 16); // matches "bottle"'s own MJCF cylinder proportions
  const color = FALLBACK_COLORS[name.replace(/_\d+$/, '')] ?? 0xaaaaaa;
  const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color }));
  scene3d.add(mesh);
  return mesh;
}

function buildObjectMeshes(objectMeshData) {
  for (const [name, meshData] of Object.entries(objectMeshData || {})) {
    objectMeshes[name] = buildObjectMesh(name, meshData);
  }
}

function meshForObject(name) {
  if (objectMeshes[name]) return objectMeshes[name];
  // No real mesh available for this body (e.g. "bottle") -- fall back to a
  // shape-matched primitive instead of leaving it invisible.
  const mesh = buildFallbackObjectMesh(name);
  objectMeshes[name] = mesh;
  return mesh;
}

// ---------------------------------------------------------------------------
// Real SO-101 arms via urdf-loader. Two independent robot instances (left,
// right) are loaded from the same URDF and positioned at the compiled MJCF's
// left_arm_base / right_arm_base offsets (GET /api/info -> arm_rig.bases),
// so they sit roughly where the sim's placeholder arms sit.
// ---------------------------------------------------------------------------

// The URDF's own joint chain, base-to-gripper (so101_new_calib.urdf).
// Index i here receives robot_state[i] (this arm's i-th actuated qpos, in
// actuator order) -- see the module docstring above for why this is an
// index mapping, not a name mapping: the URDF and the sim's placeholder rig
// are different skeletons with different joint names.
const ARM_JOINT_ORDER = [
  'shoulder_pan', 'shoulder_lift', 'elbow_flex', 'wrist_flex', 'wrist_roll', 'gripper',
];

const urdfRobots = {}; // 'left' | 'right' -> URDFRobot instance
let armsReady = false;

function loadArm(side, basePosMujoco) {
  const manager = new THREE.LoadingManager();
  const loader = new URDFLoader(manager);
  loader.packages = { '': '/static/so101/' };
  loader.load('/static/so101/so101_new_calib.urdf', (robot) => {
    // The URDF itself is Z-up (shoulder_pan's own joint axis is "0 0 1",
    // arm rises along the URDF's local +Z) -- urdf-loader does NOT convert
    // this to three.js's Y-up on its own, so without correcting for it the
    // whole robot renders lying on its side. Wrap the robot in a pivot group
    // so world placement (position, mirroring) and the URDF's own up-axis
    // fix are applied as separate, non-conflicting rotations instead of
    // fighting each other through a single Euler order.
    const pivot = new THREE.Group();
    robot.rotation.x = -Math.PI / 2; // URDF Z-up -> three.js Y-up, robot's own local frame
    pivot.add(robot);

    // mujoco z-up -> three y-up, same real-rotation remap used everywhere
    // else in this file (mjPosToThree) -- NOT the old (x, z, y) axis-swap,
    // which was a mirror reflection (determinant -1), not a rotation.
    pivot.position.copy(mjPosToThree(basePosMujoco));
    // The right arm faces the opposite way across the table (mirror around
    // the now-vertical Y axis, applied to the pivot -- not to `robot`, so it
    // doesn't interact with the X rotation above).
    if (side === 'right') pivot.rotation.y = Math.PI;

    robot.traverse((c) => {
      if (c.isMesh) {
        c.material = new THREE.MeshStandardMaterial({
          color: side === 'left' ? 0xe0b04a : 0xe06a6a,
          metalness: 0.15,
          roughness: 0.65,
        });
      }
    });
    scene3d.add(pivot);
    urdfRobots[side] = robot;
    armsReady = true;
  });
}

function buildArmRig(rig) {
  // rig.bases gives the sim's left_arm_base / right_arm_base world offsets
  // (configs/sim.yaml-driven, never hardcoded here) -- reuse those so the
  // real URDF arms sit where the physics actually places the placeholder
  // ones, even though the meshes themselves come from a different skeleton.
  const leftBase = rig?.bases?.left_arm_base?.body_pos;
  const rightBase = rig?.bases?.right_arm_base?.body_pos;
  loadArm('left', leftBase || [-0.55, 0, 0.75]);
  loadArm('right', rightBase || [0.55, 0, 0.75]);
}

function applyRobotState(robotState) {
  // robot_state = [actuated qpos...] then [actuated qvel...] (eval/scene.py
  // EpisodeScene.robot_state), actuator order: this rig's convention is
  // left arm's 6 values first, then right arm's 6 (see configs/sim.yaml
  // robot.left_arm_prefix / right_arm_prefix and smolvla_rollout.yaml's
  // actuator_names ordering). Only the qpos half (first 12) is used.
  if (!robotState || !armsReady) return;
  const perArm = ARM_JOINT_ORDER.length;
  ['left', 'right'].forEach((side, armIndex) => {
    const robot = urdfRobots[side];
    if (!robot) return;
    const offset = armIndex * perArm;
    ARM_JOINT_ORDER.forEach((jointName, i) => {
      const value = robotState[offset + i];
      if (typeof value === 'number' && Number.isFinite(value)) {
        robot.setJointValue(jointName, value);
      }
    });
  });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update(); // required each frame for damping to take effect
  renderer.render(scene3d, camera);
}
resizeRenderer();
animate();

// ---------------------------------------------------------------------------
// WebSocket wiring
// ---------------------------------------------------------------------------

const statusDot = document.getElementById('status-dot');
const seedSelect = document.getElementById('seed-select');
const resetBtn = document.getElementById('reset-btn');
const subtaskList = document.getElementById('subtask-list');
const logLines = document.getElementById('log-lines');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const ovSeed = document.getElementById('ov-seed');
const ovStep = document.getElementById('ov-step');
const metaPolicy = document.getElementById('meta-policy');
const metaCamera = document.getElementById('meta-camera');

function logLine(text, cls) {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  logLines.prepend(div);
  while (logLines.childElementCount > 200) logLines.removeChild(logLines.lastChild);
}

let ws;
let currentSeed = 0;

// The WebSocket connects and can receive its first "state" message (sent
// immediately on accept, see server.py's ws_endpoint) in parallel with
// loadInfo()'s fetch()+scene-build work below -- there is no ordering
// guarantee between them. Without this gate, an early state message hit
// meshForObject() for a body whose real mesh hadn't been built yet, which
// silently built a throwaway primitive fallback for it (never removed once
// the real mesh arrived later), and objects with no fallback path (the
// buildObjectMeshes()-only ones like "plate"/"cup") just... never got their
// first position/rotation applied at all, staying at three's origin
// (0,0,0) with identity rotation until happened to be repositioned by a
// later tick. Buffer the most recent message instead, and replay it once
// the scene is actually ready to receive it.
let sceneReady = false;
let pendingState = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => { statusDot.classList.add('connected'); logLine('connected'); };
  ws.onclose = () => {
    statusDot.classList.remove('connected');
    logLine('disconnected — retrying in 2s', 'err');
    setTimeout(connect, 2000);
  };
  ws.onerror = () => {};
  ws.onmessage = (event) => {
    let msg;
    try { msg = JSON.parse(event.data); } catch { return; }
    if (msg.type === 'error') { logLine('error: ' + msg.message, 'err'); return; }
    if (msg.type === 'state') {
      if (!sceneReady) { pendingState = msg; return; }
      applyState(msg);
    }
  };
}

function markSceneReady() {
  sceneReady = true;
  if (pendingState) { applyState(pendingState); pendingState = null; }
}

function applyState(msg) {
  if (typeof msg.seed === 'number') { currentSeed = msg.seed; ovSeed.textContent = msg.seed; }
  ovStep.textContent = msg.policy_steps ?? 0;

  if (msg.objects) {
    for (const [name, state] of Object.entries(msg.objects)) {
      // "drawer" is a real jointed body already drawn by buildStaticScene()
      // (floor+walls+handle group) -- move that group's whole shell, don't
      // draw a second generic primitive on top of it.
      const target = jointedBodies[name] || meshForObject(name);
      target.position.copy(mjPosToThree(state.pos));
      // Real orientation, not just position -- a plate/cup/fork left at a
      // fixed default rotation while the physics actually tips/spins it
      // was itself a "wrong placement" symptom, not just a cosmetic gap.
      if (state.quat) target.quaternion.copy(mjQuatToThree(state.quat));
    }
  }

  if (msg.robot_state) applyRobotState(msg.robot_state);

  if (msg.subtasks) renderSubtasks(msg.subtasks);
}

function renderSubtasks(subtasks) {
  subtaskList.innerHTML = '';
  for (const [name, status] of Object.entries(subtasks)) {
    const row = document.createElement('div');
    row.className = 'subtask-row';
    row.innerHTML = `<span class="badge ${status}"></span><span class="subtask-name">${name.replace(/_/g,' ')}</span><span class="subtask-status">${status.replace('_',' ')}</span>`;
    subtaskList.appendChild(row);
  }
}

function sendInstruction() {
  const text = chatInput.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  logLine('you: ' + text, 'you');
  ws.send(JSON.stringify({ type: 'instruction', text }));
  chatInput.value = '';
}

sendBtn.addEventListener('click', sendInstruction);
chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendInstruction(); });
stopBtn.addEventListener('click', () => {
  if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ type: 'stop' })); logLine('stopped'); }
});
resetBtn.addEventListener('click', () => {
  const seed = parseInt(seedSelect.value, 10) || 0;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'reset', seed }));
    logLine('reset to seed ' + seed);
  }
});

async function loadInfo() {
  try {
    const res = await fetch('/api/info');
    const info = await res.json();
    metaPolicy.textContent = info.policy;
    metaCamera.textContent = info.primary_camera;
    seedSelect.innerHTML = '';
    (info.seeds || [0]).forEach((s) => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = 'seed ' + s;
      seedSelect.appendChild(opt);
    });

    if (info.static_scene) buildStaticScene(info.static_scene);
    if (info.object_meshes) buildObjectMeshes(info.object_meshes);

    if (info.arm_rig) {
      // Positions the two real URDF arms at the sim's base offsets; the
      // actual per-joint mapping is the fixed ARM_JOINT_ORDER index scheme
      // above (URDF joint names, not the MJCF's), so arm_rig.links (the
      // MJCF's own joint/actuator list) isn't needed here anymore.
      buildArmRig(info.arm_rig);
    }

    // Table/drawer/object meshes above are built synchronously (the arms
    // are the one async part, loaded over network by urdf-loader, and
    // already gated by their own armsReady flag in applyRobotState) -- so
    // objects/table are genuinely ready for a WS state message right here.
    markSceneReady();
  } catch (err) {
    logLine('failed to load /api/info: ' + err, 'err');
  }
}

loadInfo();
connect();
</script>
</body>
</html>
